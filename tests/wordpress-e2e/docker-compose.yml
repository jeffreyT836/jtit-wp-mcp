# Throwaway WordPress for end-to-end tests of the nb-mcp-bridge mu-plugin.
# Used by run.sh; not part of any deployment.
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      retries: 40

  wp-e2e:
    image: wordpress:6.8-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      # The image defines WP_DEBUG itself from this variable.
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'FS_METHOD', 'direct' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'AUTOMATIC_UPDATER_DISABLED', true );
    ports:
      - '127.0.0.1:8089:80'
    volumes:
      - wp:/var/www/html
      - ../../wordpress/nb-mcp-bridge/nb-mcp-bridge.php:/var/www/html/wp-content/mu-plugins/nb-mcp-bridge.php:ro
      - ./fixtures/nb-e2e-updates.php:/var/www/html/wp-content/mu-plugins/nb-e2e-updates.php:ro

  cli:
    image: wordpress:cli-php8.3
    user: '33:33'
    depends_on:
      - wp-e2e
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp:/var/www/html
      - ../../wordpress/nb-mcp-bridge/nb-mcp-bridge.php:/var/www/html/wp-content/mu-plugins/nb-mcp-bridge.php:ro
      - ./fixtures/nb-e2e-updates.php:/var/www/html/wp-content/mu-plugins/nb-e2e-updates.php:ro
      - ./fixtures:/fixtures:ro
    entrypoint: ['sleep', 'infinity']

volumes:
  wp:
