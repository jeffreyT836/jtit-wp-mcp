name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Nooit twee deploys tegelijk naar dezelfde server; een lopende deploy wordt afgemaakt.
concurrency:
  group: deploy-wp-mcp-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jeffreyt836/jtit-wp-mcp

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    # SSH_HOST, SSH_USER, SSH_KEY, ADMIN_EMAIL en ADMIN_PASSWORD staan als secrets in
    # deze GitHub-environment.
    environment: Hostinger
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy compose file to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.prod.yml'
          target: '/docker/jtit-wp-mcp'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN,ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            set -eo pipefail

            if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
              echo "::error::ADMIN_EMAIL en/of ADMIN_PASSWORD ontbreken in de GitHub-environment 'Hostinger'."
              exit 1
            fi

            if ! docker network inspect traefik-network >/dev/null 2>&1; then
              echo "::error::Docker-netwerk 'traefik-network' bestaat niet op deze server; zonder Traefik is niets bereikbaar."
              exit 1
            fi

            cd /docker/jtit-wp-mcp
            mv -f docker-compose.prod.yml docker-compose.yml

            # Ontbrekende secrets eenmalig genereren. Bestaande waarden worden nooit
            # overschreven: een nieuwe SITES_ENCRYPTION_KEY zou alle opgeslagen
            # application passwords onleesbaar maken.
            umask 077
            touch .env
            chmod 600 .env
            add_secret() {
              if ! grep -q "^$1=" .env; then
                printf "%s=%s\n" "$1" "$2" >> .env
                echo "::warning::$1 aangemaakt in /docker/jtit-wp-mcp/.env; zet hem in je password manager."
              fi
            }
            add_secret MCP_HTTP_TOKEN "$(openssl rand -hex 32)"
            add_secret SITES_ENCRYPTION_KEY "$(openssl rand -base64 32)"
            add_secret DASHBOARD_INGEST_TOKEN "$(openssl rand -hex 32)"
            add_secret MCP_READ_ONLY false

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            unset GHCR_TOKEN
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans

            for c in wp-mcp wp-dashboard; do
              health=starting
              for attempt in $(seq 1 30); do
                health=$(docker inspect -f '{{.State.Health.Status}}' "$c" || echo unknown)
                if [ "$health" = "healthy" ]; then
                  break
                fi
                sleep 3
              done
              if [ "$health" != "healthy" ]; then
                echo "::error::$c is na 90 seconden niet healthy (status: $health)"
                docker logs --tail 50 "$c" || true
                exit 1
              fi
            done

            # Admin-account uit de GitHub-secrets (idempotent). De waarden gaan alleen
            # mee aan dit ene proces en belanden niet in .env.
            docker compose exec -T -e ADMIN_EMAIL -e ADMIN_PASSWORD wp-dashboard \
              node dist/dashboard/seed-admin.js
            unset ADMIN_PASSWORD

            docker logout ghcr.io || true
            docker image prune -f || true
            echo "Deploy complete"
