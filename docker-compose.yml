# wp-fleet-mcp — see docs/SPEC.md §2 for the container hardening this encodes.
#
# HTTP mode (long-running, for a client that speaks Streamable HTTP over localhost):
#   docker compose --profile http up -d mcp-http
#
# Stdio mode is normally launched directly by the MCP client, not through compose,
# since it needs an attached stdin. Equivalent plain `docker run`:
#   docker run -i --rm \
#     --env-file .env \
#     -e MCP_TRANSPORT=stdio \
#     -v wp-fleet-data:/app/data \
#     -v wp-fleet-logs:/app/logs \
#     wp-fleet-mcp
#
# The `mcp-stdio` service below runs the same image in stdio mode for local testing
# with `docker compose --profile stdio run --rm mcp-stdio`.
#
# Sites live in the encrypted SQLite store on the `wp-fleet-data` volume; manage them with
#   docker compose --profile http exec mcp-http node dist/cli.js sites add --id ... --url ...
# (SITES_ENCRYPTION_KEY must be set in .env).
#
# Production (Hostinger, behind Traefik) uses docker-compose.prod.yml instead.
#
# Both services run with `read_only: true`, so if AUDIT_LOG_FILE is set (see .env.example,
# default /app/logs/audit.jsonl) it needs a writable place to land: the `wp-fleet-logs` named
# volume mounted at /app/logs below (owned by the "node" user the Dockerfile creates it for).

volumes:
  wp-fleet-data:
  wp-fleet-logs:

services:
  mcp-http:
    build: .
    image: wp-fleet-mcp
    profiles: ["http"]
    environment:
      MCP_TRANSPORT: http
      # Explicit, matching the host:container port mapping below (both 3000) — the server
      # accepts a Host header of "localhost"/"127.0.0.1" *or* "<host>:3000" for these. If you
      # change the host-side port (e.g. "127.0.0.1:3399:3000"), add the matching "host:3399"
      # entries here too — see README §3.3/§4.2 for why (Docker port mapping changes the Host
      # header the server sees, but not MCP_HTTP_PORT, which stays the container's own port).
      MCP_HTTP_ALLOWED_HOSTS: "localhost:3000,127.0.0.1:3000"
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - wp-fleet-data:/app/data
      - wp-fleet-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  mcp-stdio:
    build: .
    image: wp-fleet-mcp
    profiles: ["stdio"]
    environment:
      MCP_TRANSPORT: stdio
    env_file: .env
    volumes:
      - wp-fleet-data:/app/data
      - wp-fleet-logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stdin_open: true
